# Pin the compiler every runner and CI uses, so a fresh clone never
# breaks on a compiler it did not test. Bump deliberately: install the
# new stable beside this one, run the full vault-core suite on it, then
# move this pin (and the runner image toolchain) in the same change.
# 1.100.0 validated: full vault-core suite green (2026-11-17).
[toolchain]
channel = "1.100.0"
profile = "minimal"

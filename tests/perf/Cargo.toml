[package]
name = "vault-perf"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
description = "Performance harness for mailchat-vault: deterministic fixtures, search latency percentiles, app-startup cost, FTS index size."

# Intentionally its own workspace: the harness must not alter the product
# workspace, its lockfile, or what `cargo test` / `cargo clippy` build at the
# repo root. It reaches vault-core by path and pins the same dependency
# versions the root workspace uses.
[workspace]

[dependencies]
vault-core = { path = "../../crates/vault-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package]
name = "vault-retrieval"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
description = "Retrieval-quality benchmark harness for mailchat-vault: labeled question set over a synthetic corpus, recall/MRR/false-confidence metrics and latency through the product's own search paths."

# Intentionally its own workspace, exactly like tests/perf: the harness
# must not alter the product workspace, its lockfile, or what
# `cargo test` / `cargo clippy` build at the repo root. It reaches
# vault-core by path and pins the same dependency versions the root
# workspace uses.
[workspace]

[dependencies]
vault-core = { path = "../../crates/vault-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

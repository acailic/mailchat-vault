[package]
name = "mailchat-vault"
description = "Mailchat Vault — local email & chat archive desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "mailchat-vault"

[features]
# Opt-in at-rest archive encryption: forwards to vault-core's feature
# and compiles the OS-keyring vault-key adapter (`vault_key`). Default
# builds stay exactly as before (plaintext vaults).
encryption = ["vault-core/encryption"]

[lib]
name = "mailchat_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { workspace = true }
fs4 = "1.1.0"
keyring = "4"
libloading = "0.8"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
vault-core = { path = "../crates/vault-core" }
webbrowser = "1"

[dev-dependencies]
tempfile = "3"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mailchat Vault</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font: 15px/1.45 system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        max-width: 860px;
      }
      header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
      h1 { font-size: 20px; margin: 0; }
      h2 { font-size: 15px; margin: 0 0 8px; color: gray; }
      #stats { color: gray; font-size: 13px; }
      section { margin-bottom: 16px; }
      .row { display: flex; gap: 8px; }
      input[type="text"] { flex: 1; padding: 6px 8px; font: inherit; }
      button { padding: 6px 12px; font: inherit; cursor: pointer; }
      #status { margin-top: 6px; font-size: 13px; color: gray; min-height: 1em; }
      #status.error { color: crimson; }
      #results { list-style: none; margin: 0; padding: 0; }
      #results li { padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
      .meta { color: gray; font-size: 13px; }
      .body { margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
      h2 { font-size: 15px; margin: 0 0 8px; }
      #llm-note {
        margin-top: 6px; padding: 8px 10px; font-size: 13px;
        border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        border-radius: 8px;
      }
      #answer {
        margin-top: 8px; padding: 10px 12px; white-space: pre-wrap;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        border-radius: 8px;
      }
      #ask-notes { margin-top: 6px; font-size: 13px; color: darkorange; }
    </style>
  </head>
  <body>
    <header>
      <h1>Mailchat Vault</h1>
      <span id="stats">…</span>
    </header>

    <section>
      <div class="row">
        <input id="search" type="text" placeholder="Search the archive (FTS5)…" autofocus />
        <button id="search-btn" type="button">Search</button>
      </div>
      <div id="status"></div>
      <ul id="results"></ul>
    </section>

    <section>
      <h2>Ask the archive (natural language)</h2>
      <div class="row">
        <input id="ask" type="text" placeholder="e.g. “what did Ana say about the vault in October?”" />
        <button id="ask-btn" type="button">Ask</button>
      </div>
      <div id="llm-note" class="meta"></div>
      <div id="ask-status" class="meta" style="margin-top: 6px; min-height: 1em"></div>
      <div id="answer" hidden></div>
      <div id="ask-notes" hidden></div>
      <ul id="ask-results"></ul>
    </section>

    <section>
      <div class="row">
        <input id="mbox-path" type="text" placeholder="/path/to/archive.mbox" />
        <button id="import-btn" type="button">Import .mbox</button>
        <button id="chat-import-btn" type="button">Import chat export…</button>
        <button id="seed-btn" type="button">Load demo</button>
      </div>
      <div id="import-status" class="meta" style="margin-top: 6px"></div>
    </section>

    <section>
      <h2>IMAP sync</h2>
      <div class="row">
        <input id="imap-host" type="text" placeholder="imap.gmail.com" value="imap.gmail.com" />
        <input id="imap-port" type="number" placeholder="993" value="993" style="max-width: 90px" />
      </div>
      <div class="row">
        <input id="imap-user" type="text" placeholder="you@gmail.com" />
        <input id="imap-pass" type="password" placeholder="App password" autocomplete="off" />
      </div>
      <div class="row">
        <input id="imap-folders" type="text" placeholder="INBOX (comma-separated folders)" />
        <button id="imap-sync-btn" type="button">Sync</button>
      </div>
      <div id="imap-status" class="meta" style="margin-top: 6px"></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

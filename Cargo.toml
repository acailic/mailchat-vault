[workspace]
resolver = "2"
members = ["crates/vault-core", "src-tauri"]
# `cargo test` / `cargo build` at the repo root exercise only vault-core so the
# logic tests run on any machine (the Tauri app crate needs Linux webkit2gtk
# system libraries; CI and dev machines with the prerequisites build it with
# `cargo test --workspace` or `npm run tauri dev`).
default-members = ["crates/vault-core"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/acailic/mailchat-vault"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
imap = { version = "2.4", default-features = false }
mailparse = "0.16"
notify = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# `bundled-sqlcipher-vendored-openssl` replaces the former plain
# `bundled` feature: libsqlite3-sys compiles the SQLCipher amalgamation
# (AES-256 at-rest encryption) plus a vendored OpenSSL, so no system
# OpenSSL is needed. It implies `bundled-sqlcipher`; `functions` and
# `backup` are kept as before. Encryption itself stays opt-in at the
# vault-core `encryption` feature — SQLCipher opens plaintext files
# unchanged, so default builds behave exactly as before.
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "functions", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"

[profile.dev.package."libsqlite3-sys"]
# Keep dev/test builds debuggable but let the bundled SQLite C code run at
# release speed: FTS queries are CPU-bound inside sqlite3.c, and the perf
# contract (search < 100 ms over 100k messages) is asserted in `cargo test`.
opt-level = 3

[profile.dev.package.vault-core]
# Same rationale as libsqlite3-sys above, for our own CPU-bound code: the
# vector scan is 512 integer multiply-adds per embedded message, and its
# perf contract over 100k messages (tests/vector_perf.rs) is asserted in
# `cargo test` (debug profile). Optimizing only this crate keeps the rest
# of the dev/test build debuggable.
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true

name: Release

# Builds distributable installers on a version tag (v*).
#
# A tag push creates a DRAFT GitHub Release with one artifact set per
# platform (see docs/release.md for the smoke-test checklist that should
# run before a draft is published):
#
#   Linux   ubuntu-22.04  -> .AppImage + .deb     (x86_64)
#   macOS   macos-latest  -> universal .dmg + .app tarball (aarch64 + x86_64)
#   Windows windows-latest-> .msi (WiX) + NSIS .exe
#
# Code signing: NONE in this round. Linux artifacts need none; the macOS
# and Windows artifacts are unsigned — Gatekeeper/SmartScreen will warn
# (documented in docs/release.md). Signing keys are deliberately not
# wired into CI yet.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # tauri-action creates/updates the (draft) release and uploads assets

jobs:
  build-linux:
    runs-on: ubuntu-22.04 # oldest still-supported LTS -> AppImage/deb run on 22.04+
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mailchat Vault v__version__"
          releaseBody: "See the assets below and docs/release.md for install & smoke-test instructions. Linux AppImage/.deb, macOS .dmg and Windows .msi/.exe are unsigned in this round."
          releaseDraft: true
          prerelease: false
          args: --bundles appimage,deb

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # Unsigned build (no APPLE_CERTIFICATE* secrets): the dmg/app are
      # ad-hoc signed only; Gatekeeper will prompt on first open.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mailchat Vault v__version__"
          releaseBody: "See the assets below and docs/release.md for install & smoke-test instructions. Linux AppImage/.deb, macOS .dmg and Windows .msi/.exe are unsigned in this round."
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin --bundles app,dmg

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # Unsigned build (no TAURI_SIGNING_* / certificate secrets):
      # Windows will show a SmartScreen warning on first run.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mailchat Vault v__version__"
          releaseBody: "See the assets below and docs/release.md for install & smoke-test instructions. Linux AppImage/.deb, macOS .dmg and Windows .msi/.exe are unsigned in this round."
          releaseDraft: true
          prerelease: false
          args: --bundles msi,nsis

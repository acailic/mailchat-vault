name: Release

# Builds distributable installers on a version tag (v*).
#
# A tag push first creates a single DRAFT GitHub Release (create-release
# job), then three platform jobs build and attach their bundles to that
# draft — no job ever creates or races on the release itself. See
# docs/release.md for the smoke-test checklist to run before publishing:
#
#   Linux    ubuntu-22.04   -> .AppImage + .deb            (x86_64)
#   macOS    macos-latest   -> universal .dmg + .app tarball
#   Windows  windows-latest -> .msi (WiX) + NSIS .exe
#
# Bundles are also uploaded as workflow-run artifacts for pre-publish
# inspection.
#
# Code signing: NONE in this round. Linux artifacts need none; the macOS
# and Windows artifacts are unsigned — Gatekeeper/SmartScreen will warn
# (documented in docs/release.md). Signing keys are deliberately not
# wired into CI yet.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create-release drafts the release; build jobs upload assets

env:
  RELEASE_BODY: |
    See the assets below and docs/release.md for install & smoke-test
    instructions. Linux AppImage/.deb, macOS .dmg and Windows .msi/.exe
    are unsigned in this round.

    macOS install: open the .dmg and drag the app to /Applications. The
    dmg is unsigned (ad-hoc signature only), so Gatekeeper blocks the
    first launch: right-click the app -> Open -> Open, or run
    `xattr -cr /Applications/mailchat-vault.app` in Terminal first.

    Windows first run: SmartScreen -> "More info" -> "Run anyway".

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Single owner of release creation: idempotent on re-runs of the
      # same tag (a re-run finds the existing draft instead of failing).
      - name: Create draft release for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          title="Mailchat Vault v${version}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$title" --notes "$RELEASE_BODY"
          else
            echo "release for $TAG already exists; keeping it"
          fi

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04 # oldest still-supported LTS -> AppImage/deb run on 22.04+
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      # No release inputs -> tauri-action only builds; assets are attached
      # to the draft by the upload step below.
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles appimage,deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          if-no-files-found: error
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb

      - name: Attach bundles to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release upload "$TAG" --clobber
          target/release/bundle/appimage/*.AppImage
          target/release/bundle/deb/*.deb

  # M6.3 acceptance gate: run the deb + AppImage smoke suites against
  # clean ubuntu 22.04 AND 24.04 containers (the same script used
  # locally: scripts/release/smoke-linux.sh). Verifies apt dependency
  # resolution, .desktop + icon + MIME association installed by the deb,
  # launcher-style launch without a terminal, and that the AppImage is
  # self-contained on a system with no app libraries.
  smoke-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: bundles

      - name: Run Linux release smoke (deb + AppImage) on ubuntu-${{ matrix.ubuntu }}
        run: scripts/release/smoke-linux.sh --bundles bundles --versions "${{ matrix.ubuntu }}" --logs smoke-logs

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-${{ matrix.ubuntu }}
          path: smoke-logs/
          if-no-files-found: ignore

  build-macos:
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # Unsigned build (no APPLE_CERTIFICATE* secrets): the dmg/app are
      # ad-hoc signed only; Gatekeeper will prompt on first open.
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Tarball the .app bundle
        run: |
          app="$(find target/universal-apple-darwin/release/bundle/macos -name '*.app' -maxdepth 1)"
          tar -czf "${app%.app}.app.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"

      # M6.1: never attach an unverified dmg — smoke-test it the same way
      # the ci.yml macos-dmg-smoke job does before it reaches the draft.
      - name: Smoke-test the dmg (mount, copy, --version/--help)
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          dmg="$(find target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          scripts/dmg-smoke-test.sh "$dmg" "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          if-no-files-found: error
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

      - name: Attach bundles to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release upload "$TAG" --clobber
          target/universal-apple-darwin/release/bundle/dmg/*.dmg
          target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

  build-windows:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # Unsigned build (no signing certificate secrets): Windows will show
      # a SmartScreen warning on first run.
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles msi,nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

      - name: Attach bundles to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release upload "$TAG" --clobber
          target/release/bundle/msi/*.msi
          target/release/bundle/nsis/*.exe

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run check

      - name: Frontend unit tests
        run: npm test

      # Produces dist/, which the Tauri app build script embeds.
      - name: Build frontend
        run: npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (core + app)
        run: cargo test --workspace

  # M6.1: macOS dmg smoke test. Builds the universal .dmg exactly the
  # way the release workflow does, then runs scripts/dmg-smoke-test.sh
  # against it: mount, copy the .app out, verify the binary is universal
  # (x86_64 + arm64), and headlessly run --version/--help. Proves the
  # packaged macOS artifact actually launches before a release ships it.
  macos-dmg-smoke:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # The repo pins its toolchain in rust-toolchain.toml; `rustup target
      # add` here installs the cross-compile targets onto THAT toolchain
      # (the dtolnay action only installs them for `stable`, and the
      # universal build runs on the pinned one).
      - name: Install universal-dmg Rust targets (pinned toolchain)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the universal dmg
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: dmg smoke test (mount, copy, --version/--help)
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          dmg="$(find target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          scripts/dmg-smoke-test.sh "$dmg" "$version"

  # Full E2E: drives the real app binary through tauri-driver/WebDriver
  # under Xvfb (see tests/e2e/README.md). Every path here runs headless.
  # Pinned to 24.04: it is the image the suite was validated on, and it
  # ships the `webkit2gtk-driver` package (on 26.04+ the package is renamed
  # `webkitgtk-webdriver`).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux system dependencies + E2E drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb \
            sqlite3 \
            xdotool \
            dbus \
            gnome-keyring

      - name: Cache tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri-driver
          key: tauri-driver-${{ runner.os }}-v2.1.0

      - name: Install tauri-driver
        run: |
          if [ ! -x "$HOME/.cache/tauri-driver/bin/tauri-driver" ]; then
            cargo install tauri-driver --locked --root "$HOME/.cache/tauri-driver"
          fi
          echo "$HOME/.cache/tauri-driver/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci

      # Produces dist/, which the Tauri app build script embeds.
      - name: Build frontend
        run: npm run build

      - name: Build the app
        run: cargo build -p mailchat-vault --features tauri/custom-protocol

      - name: E2E tests (headless)
        env:
          # Software-rendered WebKit must not try the DMABUF renderer —
          # under Xvfb it dies and the webview renders nothing.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        # The e2e app talks to the session bus for the single-instance
        # guard and the OS keyring. On a bare runner there is no
        # org.freedesktop.secrets service, and every keyring lookup then
        # stalls the full dbus timeout (120 s) — enough to starve the
        # spec watchdogs. A private dbus session with an unlocked
        # gnome-keyring gives every spec a fast, isolated secrets service.
        run: |
          dbus-run-session -- bash -c '
            out=$(echo -n "" | gnome-keyring-daemon --unlock --components=secrets 2>/dev/null)
            eval "export $out"
            exec xvfb-run -a --server-args="-screen 0 1280x960x24" npm run test:e2e
          '

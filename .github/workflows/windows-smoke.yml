name: Windows smoke

# Automated Windows release smoke test (M6.2): builds the Windows
# installers from a ref, then on a real windows-latest runner runs
# scripts/windows-smoke.ps1, which exercises:
#
#   1. MSI  fresh install -> launch -> alive -> vault.db created ->
#      uninstall -> archive survives the uninstall
#   2. NSIS fresh install -> launch -> alive -> uninstall -> archive
#      survives
#   3. MSI  in-place upgrade from a published older release, seeded
#      with the frozen v0.1.0 fixture archive -> archive intact after
#      the upgrade (content digests identical, schema may advance)
#   4. NSIS in-place upgrade, same contract
#
# Run it manually (Actions tab -> Windows smoke -> Run workflow) after
# tagging a release and before publishing its draft — the same gate
# docs/release.md asks for, automated. See tests/windows-smoke/README.md
# for the full contract and the 1638/reinstall nuance.
#
# NOTE: repo workflows are currently disabled by decision (pushes skip
# CI); this workflow is dispatched manually until that changes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch/tag/SHA) to build the NEW bundles from"
        required: false
        default: ""
        type: string
      old_tag:
        description: "Published release tag to upgrade from (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"
        type: string
      run_upgrade:
        description: "Run the old->new upgrade phases"
        required: false
        default: true
        type: boolean
      version_override:
        description: >
          Optional semver (e.g. 0.1.50) patched into the build only, to
          exercise a true versioned upgrade when the ref still carries
          the old version number. Never used for real releases.
        required: false
        default: ""
        type: string

permissions:
  contents: read # downloading the old release's assets

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OLD_TAG: ${{ inputs.old_tag || 'v0.1.0' }}
      RUN_UPGRADE: ${{ inputs.run_upgrade == false && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Patch build version (test-only override)
        if: ${{ inputs.version_override != '' }}
        shell: pwsh
        run: |
          $v = '${{ inputs.version_override }}'
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $v
          $conf | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json
          (Get-Content Cargo.toml -Raw) `
            -replace 'version = "0\.1\.0"', ('version = "{0}"' -f $v) |
            Set-Content Cargo.toml
          Write-Host "patched build version to $v (test-only)"

      - name: Build Windows installers (msi + nsis)
        shell: pwsh
        run: npm run tauri build "--" "--bundles" "msi,nsis"

      - name: Build the archive digest tool
        run: cargo build --release -p vault-core --example smoke_inspect

      - name: Download the old release installers
        if: ${{ env.RUN_UPGRADE == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path old-bundles | Out-Null
          gh release download "$env:OLD_TAG" --repo "$env:GITHUB_REPOSITORY" `
            --pattern "*_x64_en-US.msi" --pattern "*_x64-setup.exe" `
            --dir old-bundles
          Get-ChildItem old-bundles

      - name: Run the installer smoke test
        shell: pwsh
        run: |
          $newMsi = Get-ChildItem target\release\bundle\msi\*.msi |
            Select-Object -First 1 -ExpandProperty FullName
          $newExe = Get-ChildItem target\release\bundle\nsis\*-setup.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $newMsi -or -not $newExe) {
            throw "bundles not found under target\release\bundle"
          }
          $oldMsi = ''
          $oldExe = ''
          if ($env:RUN_UPGRADE -eq 'true') {
            $oldMsi = Get-ChildItem old-bundles\*.msi |
              Select-Object -First 1 -ExpandProperty FullName
            $oldExe = Get-ChildItem old-bundles\*-setup.exe |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $oldMsi -or -not $oldExe) {
              throw "old release $env:OLD_TAG has no Windows assets"
            }
          }
          $fixture = Join-Path $PWD "tests\windows-smoke\fixtures\vault-v0.1.0.db"
          $inspect = Join-Path $PWD "target\release\examples\smoke_inspect.exe"
          & scripts\windows-smoke.ps1 `
            -NewMsi $newMsi -NewExe $newExe `
            -OldMsi $oldMsi -OldExe $oldExe -OldLabel $env:OLD_TAG `
            -FixtureDb $fixture -InspectExe $inspect -AllowDataWipe

      - name: Upload smoke logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-logs
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/windows-smoke/**
